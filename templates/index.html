              const b = data[i + 2];

              sumR += r;
              sumG += g;
              sumB += b;
              count++;

              const maxc = Math.max(r, g, b);
              const minc = Math.min(r, g, b);
              const sat = maxc === 0 ? 0 : ((maxc - minc) / maxc) * 255;
              const val = maxc;

              if (val >= 168 && sat <= 72) whitePixels++;
            }
          }

          if (!count) continue;

          const ar = sumR / count;
          const ag = sumG / count;
          const ab = sumB / count;
          const avgMax = Math.max(ar, ag, ab);
          const avgMin = Math.min(ar, ag, ab);
          const avgSat = avgMax === 0 ? 0 : ((avgMax - avgMin) / avgMax) * 255;
          const avgVal = avgMax;
          const whiteRatio = whitePixels / count;

          const whiteScore =
            (avgVal >= 162 ? 0.45 : 0) +
            (avgSat <= 78 ? 0.28 : 0) +
            Math.min(0.45, whiteRatio * 0.70);

          grid[gy][gx] = whiteScore >= 0.72 ? 1 : 0;
        }
      }

      closeGridMask(grid, rows, cols, 2);
      fillGridHoles(grid, rows, cols);

      const comps = connectedGridComponents(grid, rows, cols);
      let best = null;
      let bestScore = -Infinity;

      for (const comp of comps) {
        const cW = comp.maxX - comp.minX + 1;
        const cH = comp.maxY - comp.minY + 1;
        const rectCells = cW * cH;
        const fill = comp.count / Math.max(1, rectCells);

        const pxW = cW * cell;
        const pxH = cH * cell;
        const boxRatio = (pxW * pxH) / (w * h);

        if (cW < cols * 0.34 || cH < rows * 0.30) continue;
        if (boxRatio < 0.12 || boxRatio > 0.94) continue;

        const x0 = comp.minX * cell;
        const y0 = comp.minY * cell;
        const x1 = Math.min(w - 1, (comp.maxX + 1) * cell);
        const y1 = Math.min(h - 1, (comp.maxY + 1) * cell);

        const pts = [
          { x: x0 / scale, y: y0 / scale },
          { x: x1 / scale, y: y0 / scale },
          { x: x1 / scale, y: y1 / scale },
          { x: x0 / scale, y: y1 / scale }
        ];

        const q = orderPoints(pts);
        const ratioScore = pptGridRatioScore(q);
        const centerScore = centerBiasScore(q);
        const sizeScore = Math.min(1.75, boxRatio * 2.35);
        const outerScore = pptGridOuterScore(cols, rows, comp);

        const score =
          0.34 * sizeScore +
          0.24 * outerScore +
          0.20 * ratioScore +
          0.14 * centerScore +
          0.08 * Math.min(1.4, fill * 1.3);

        if (score > bestScore) {
          bestScore = score;
          best = q;
        }
      }

      if (!best) return detectPptGridSafeFallback();

      return expandPoints(best, imageW, imageH, 0.003);
    } catch (err) {
      console.warn("grid white slide detection failed", err);
      return detectPptGridSafeFallback();
    }
  }

  function closeGridMask(grid, rows, cols, iterations) {
    for (let k = 0; k < iterations; k++) dilateGrid(grid, rows, cols);
    for (let k = 0; k < iterations; k++) erodeGrid(grid, rows, cols);
  }

  function dilateGrid(grid, rows, cols) {
    const copy = grid.map(r => r.slice());

    for (let y = 1; y < rows - 1; y++) {
      for (let x = 1; x < cols - 1; x++) {
        if (copy[y][x]) continue;

        if (
          copy[y - 1][x] || copy[y + 1][x] ||
          copy[y][x - 1] || copy[y][x + 1] ||
          copy[y - 1][x - 1] || copy[y - 1][x + 1] ||
          copy[y + 1][x - 1] || copy[y + 1][x + 1]
        ) {
          grid[y][x] = 1;
        }
      }
    }
  }

  function erodeGrid(grid, rows, cols) {
    const copy = grid.map(r => r.slice());

    for (let y = 1; y < rows - 1; y++) {
      for (let x = 1; x < cols - 1; x++) {
        if (!copy[y][x]) continue;

        if (!copy[y - 1][x] || !copy[y + 1][x] || !copy[y][x - 1] || !copy[y][x + 1]) {
          grid[y][x] = 0;
        }
      }
    }
  }

  function fillGridHoles(grid, rows, cols) {
    const copy = grid.map(r => r.slice());

    for (let y = 1; y < rows - 1; y++) {
      for (let x = 1; x < cols - 1; x++) {
        if (copy[y][x]) continue;

        let count = 0;
        for (let yy = -1; yy <= 1; yy++) {
          for (let xx = -1; xx <= 1; xx++) {
            count += copy[y + yy][x + xx];
          }
        }

        if (count >= 6) grid[y][x] = 1;
      }
    }
  }

  function connectedGridComponents(grid, rows, cols) {
    const visited = Array.from({ length: rows }, () => new Array(cols).fill(false));
    const comps = [];

    for (let sy = 0; sy < rows; sy++) {
      for (let sx = 0; sx < cols; sx++) {
        if (!grid[sy][sx] || visited[sy][sx]) continue;

        const queue = [{ x: sx, y: sy }];
        visited[sy][sx] = true;

        let head = 0;
        let minX = sx, maxX = sx, minY = sy, maxY = sy;
        let count = 0;

        while (head < queue.length) {
          const { x, y } = queue[head++];
          count++;

          if (x < minX) minX = x;
          if (x > maxX) maxX = x;
          if (y < minY) minY = y;
          if (y > maxY) maxY = y;

          const ns = [
            { x: x - 1, y },
            { x: x + 1, y },
            { x, y: y - 1 },
            { x, y: y + 1 }
          ];

          for (const n of ns) {
            if (n.x < 0 || n.x >= cols || n.y < 0 || n.y >= rows) continue;
            if (visited[n.y][n.x] || !grid[n.y][n.x]) continue;

            visited[n.y][n.x] = true;
            queue.push(n);
          }
        }

        comps.push({ minX, maxX, minY, maxY, count });
      }
    }

    comps.sort((a, b) => b.count - a.count);
    return comps;
  }

  function pptGridRatioScore(q) {
    q = orderPoints(q);

    const top = dist(q[0], q[1]);
    const bottom = dist(q[3], q[2]);
    const left = dist(q[0], q[3]);
    const right = dist(q[1], q[2]);

    const ww = Math.max(1, (top + bottom) / 2);
    const hh = Math.max(1, (left + right) / 2);
    const ratio = ww / hh;

    const targets = [1.20, 1.33, 1.45, 1.60, 1.78];
    let best = 0.45;

    for (const t of targets) {
      const diff = Math.abs(ratio - t);
      if (diff < 0.12) best = Math.max(best, 1.45);
      else if (diff < 0.25) best = Math.max(best, 1.18);
      else if (diff < 0.42) best = Math.max(best, 0.92);
      else if (diff < 0.65) best = Math.max(best, 0.68);
    }

    return best;
  }

  function pptGridOuterScore(cols, rows, comp) {
    let score = 0.55;

    if (comp.minX < cols * 0.24) score += 0.24;
    if (comp.maxX > cols * 0.66) score += 0.24;
    if (comp.minY < rows * 0.34) score += 0.22;
    if (comp.maxY > rows * 0.58) score += 0.22;

    return Math.min(1.55, score);
  }

  function detectPptGridSafeFallback() {
    const left = imageW * 0.080;
    const right = imageW * 0.920;
    const top = imageH * 0.115;
    const bottom = imageH * 0.875;

    return [
      { x: left, y: top },
      { x: right, y: top },
      { x: right, y: bottom },
      { x: left, y: bottom }
    ];
  }

  function detectPptWhiteSlideMask() {
    // HSV 흰 슬라이드 마스크 방식.
    // 목적: 빨간 대외비/노란 형광펜/검정 글자/회색 배경을 제거하고 흰 슬라이드만 남긴다.
    // 저장용 원본에는 적용하지 않고 탐지용 임시 이미지에서만 사용한다.
    if (!window.cvReady || typeof cv === "undefined") {
      return detectPptWhiteByCanvasMask();
    }

    let src = null;
    let hsv = null;
    let mask = null;
    let kernelClose = null;
    let kernelDilate = null;
    let contours = null;
    let hierarchy = null;

    try {
      const maxSide = 1100;
      const scale = Math.min(maxSide / imageW, maxSide / imageH, 1);
      const w = Math.max(1, Math.round(imageW * scale));
      const h = Math.max(1, Math.round(imageH * scale));

      const temp = document.createElement("canvas");
      temp.width = w;
      temp.height = h;
      const tctx = temp.getContext("2d", { willReadFrequently: true });
      tctx.drawImage(img, 0, 0, w, h);

      src = cv.imread(temp);
      hsv = new cv.Mat();
      mask = new cv.Mat();

      cv.cvtColor(src, hsv, cv.COLOR_RGBA2RGB);
      cv.cvtColor(hsv, hsv, cv.COLOR_RGB2HSV);

      // HSV:
      // S 낮음 = 색이 거의 없음
      // V 높음 = 밝음
      // 빨간 박스/노란 형광펜은 S가 높아서 제거됨.
      const low = new cv.Mat(hsv.rows, hsv.cols, hsv.type(), [0, 0, 168, 0]);
      const high = new cv.Mat(hsv.rows, hsv.cols, hsv.type(), [179, 58, 255, 255]);
      cv.inRange(hsv, low, high, mask);
      low.delete();
      high.delete();

      // 구멍 메우기:
      // 글자/표선 때문에 슬라이드가 조각나는 것을 크게 붙인다.
      kernelClose = cv.Mat.ones(31, 31, cv.CV_8U);
      kernelDilate = cv.Mat.ones(9, 9, cv.CV_8U);

      cv.morphologyEx(mask, mask, cv.MORPH_CLOSE, kernelClose);
      cv.dilate(mask, mask, kernelDilate);
      cv.morphologyEx(mask, mask, cv.MORPH_CLOSE, kernelClose);

      contours = new cv.MatVector();
      hierarchy = new cv.Mat();
      cv.findContours(mask, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

      const imageArea = w * h;
      let best = null;
      let bestScore = -Infinity;

      for (let i = 0; i < contours.size(); i++) {
        const cnt = contours.get(i);
        const area = cv.contourArea(cnt);
        const rect = cv.boundingRect(cnt);

        const bw = rect.width;
        const bh = rect.height;
        const boxArea = bw * bh;
        const boxRatio = boxArea / imageArea;

        if (bw < w * 0.38 || bh < h * 0.34) {
          cnt.delete();
          continue;
        }

        if (boxRatio < 0.14 || boxRatio > 0.92) {
          cnt.delete();
          continue;
        }

        const pts = [
          { x: rect.x / scale, y: rect.y / scale },
          { x: (rect.x + rect.width) / scale, y: rect.y / scale },
          { x: (rect.x + rect.width) / scale, y: (rect.y + rect.height) / scale },
          { x: rect.x / scale, y: (rect.y + rect.height) / scale }
        ];

        const q = orderPoints(pts);
        const ratio = pptWhiteSlideRatioScore(q);
        const center = centerBiasScore(q);
        const size = Math.min(1.8, boxRatio * 2.4);
        const outer = pptWhiteOuterScore(w, h, rect);

        // 내부 표/대외비 박스 배제:
        // 내부 표는 면적이 작고, 슬라이드보다 중앙/아래쪽에 몰리는 경향.
        const score =
          0.34 * size +
          0.24 * ratio +
          0.20 * center +
          0.22 * outer;

        if (score > bestScore) {
          bestScore = score;
          best = q;
        }

        cnt.delete();
      }

      if (!best) {
        return detectPptWhiteByCanvasMask();
      }

      return expandPoints(best, imageW, imageH, 0.004);
    } catch (err) {
      console.warn("HSV white slide mask detection failed", err);
      return detectPptWhiteByCanvasMask();
    } finally {
      if (src) src.delete();
      if (hsv) hsv.delete();
      if (mask) mask.delete();
      if (kernelClose) kernelClose.delete();
      if (kernelDilate) kernelDilate.delete();
      if (contours) contours.delete();
      if (hierarchy) hierarchy.delete();
    }
  }

  function pptWhiteSlideRatioScore(q) {
    q = orderPoints(q);
    const top = dist(q[0], q[1]);
    const bottom = dist(q[3], q[2]);
    const left = dist(q[0], q[3]);
    const right = dist(q[1], q[2]);

    const ww = Math.max(1, (top + bottom) / 2);
    const hh = Math.max(1, (left + right) / 2);
    const ratio = ww / hh;

    const targets = [1.20, 1.33, 1.45, 1.60, 1.78];
    let best = 0.45;

    for (const t of targets) {
      const diff = Math.abs(ratio - t);
      if (diff < 0.12) best = Math.max(best, 1.45);
      else if (diff < 0.25) best = Math.max(best, 1.18);
      else if (diff < 0.42) best = Math.max(best, 0.92);
      else if (diff < 0.65) best = Math.max(best, 0.68);
    }

    return best;
  }

  function pptWhiteOuterScore(w, h, rect) {
    let score = 0.55;

    if (rect.x < w * 0.26) score += 0.22;
    if (rect.x + rect.width > w * 0.68) score += 0.22;
    if (rect.y < h * 0.34) score += 0.20;
    if (rect.y + rect.height > h * 0.62) score += 0.20;

    return Math.min(1.50, score);
  }

  function detectPptWhiteByCanvasMask() {
    // OpenCV 로딩 실패 시 JS 캔버스만으로 처리하는 백업.
    try {
      const maxSide = 900;
      const scale = Math.min(maxSide / imageW, maxSide / imageH, 1);
      const w = Math.max(1, Math.round(imageW * scale));
      const h = Math.max(1, Math.round(imageH * scale));

      const temp = document.createElement("canvas");
      temp.width = w;
      temp.height = h;
      const tctx = temp.getContext("2d", { willReadFrequently: true });
      tctx.drawImage(img, 0, 0, w, h);

      const imgData = tctx.getImageData(0, 0, w, h);
      const data = imgData.data;

      const mask = new Uint8Array(w * h);

      for (let i = 0, p = 0; i < data.length; i += 4, p++) {
        const r = data[i];
        const g = data[i + 1];
        const b = data[i + 2];

        const max = Math.max(r, g, b);
        const min = Math.min(r, g, b);
        const v = max;
        const s = max === 0 ? 0 : ((max - min) / max) * 255;

        if (v >= 168 && s <= 58) {
          mask[p] = 1;
        }
      }

      closeMask(mask, w, h, 6);
      for (let k = 0; k < 3; k++) dilateMask(mask, w, h);
      closeMask(mask, w, h, 6);

      const comps = connectedComponents(mask, w, h, 12);
      let best = null;
      let bestScore = -Infinity;

      for (const comp of comps) {
        const bw = comp.maxX - comp.minX + 1;
        const bh = comp.maxY - comp.minY + 1;
        const boxRatio = (bw * bh) / (w * h);

        if (bw < w * 0.38 || bh < h * 0.34) continue;
        if (boxRatio < 0.14 || boxRatio > 0.92) continue;

        const pts = [
          { x: comp.minX / scale, y: comp.minY / scale },
          { x: comp.maxX / scale, y: comp.minY / scale },
          { x: comp.maxX / scale, y: comp.maxY / scale },
          { x: comp.minX / scale, y: comp.maxY / scale }
        ];

        const q = orderPoints(pts);
        const score =
          0.38 * Math.min(1.8, boxRatio * 2.4) +
          0.26 * pptWhiteSlideRatioScore(q) +
          0.18 * centerBiasScore(q) +
          0.18 * pptWhiteOuterScore(w, h, {
            x: comp.minX,
            y: comp.minY,
            width: bw,
            height: bh
          });

        if (score > bestScore) {
          bestScore = score;
          best = q;
        }
      }

      if (best) return expandPoints(best, imageW, imageH, 0.004);

      return detectPptWhiteSafeFallback();
    } catch (err) {
      console.warn("canvas white mask detection failed", err);
      return detectPptWhiteSafeFallback();
    }
  }

  function detectPptWhiteSafeFallback() {
    // 백업값. 자동탐지가 실패했을 때 내부 표를 잡는 것보다 넓은 슬라이드 근처를 반환.
    const left = imageW * 0.080;
    const right = imageW * 0.920;
    const top = imageH * 0.120;
    const bottom = imageH * 0.875;

    return [
      { x: left, y: top },
      { x: right, y: top },
      { x: right, y: bottom },
      { x: left, y: bottom }
    ];
  }

  function detectPptSlideBySharpenedHoughLines() {
    // 선명화 + 긴 직선 검출 기반 PPT 슬라이드 탐지.
    // 최종 저장 이미지에는 보정이 적용되지 않고, 탐지용 임시 캔버스에만 적용한다.
    if (!window.cvReady || typeof cv === "undefined") {
      return detectPptBySafeGeometryStrong();
    }

    let src = null;
    let gray = null;
    let blur = null;
    let sharp = null;
    let eq = null;
    let edges = null;
    let lines = null;
    let kernel = null;

    try {
      const maxSide = 1200;
      const scale = Math.min(maxSide / imageW, maxSide / imageH, 1);
      const w = Math.max(1, Math.round(imageW * scale));
      const h = Math.max(1, Math.round(imageH * scale));

      const temp = document.createElement("canvas");
      temp.width = w;
      temp.height = h;

      const tctx = temp.getContext("2d", { willReadFrequently: true });
      tctx.drawImage(img, 0, 0, w, h);

      src = cv.imread(temp);
      gray = new cv.Mat();
      blur = new cv.Mat();
      sharp = new cv.Mat();
      eq = new cv.Mat();
      edges = new cv.Mat();
      lines = new cv.Mat();
      kernel = cv.Mat.ones(3, 3, cv.CV_8U);

      cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);

      // 1) 선명화: unsharp mask
      cv.GaussianBlur(gray, blur, new cv.Size(0, 0), 2.0);
      cv.addWeighted(gray, 1.75, blur, -0.75, 0, sharp);

      // 2) 대비 강화: 전체 equalize. 모니터 촬영의 희미한 테두리를 살림.
      cv.equalizeHist(sharp, eq);

      // 3) 엣지 검출
      cv.Canny(eq, edges, 35, 110);
      cv.morphologyEx(edges, edges, cv.MORPH_CLOSE, kernel);

      // 4) 긴 직선 검출
      const minLineLength = Math.round(Math.min(w, h) * 0.28);
      const maxLineGap = Math.round(Math.min(w, h) * 0.035);
      cv.HoughLinesP(
        edges,
        lines,
        1,
        Math.PI / 180,
        55,
        minLineLength,
        maxLineGap
      );

      const horizontals = [];
      const verticals = [];

      for (let i = 0; i < lines.rows; i++) {
        const x1 = lines.data32S[i * 4];
        const y1 = lines.data32S[i * 4 + 1];
        const x2 = lines.data32S[i * 4 + 2];
        const y2 = lines.data32S[i * 4 + 3];

        const dx = x2 - x1;
        const dy = y2 - y1;
        const len = Math.hypot(dx, dy);
        if (len < minLineLength) continue;

        const angle = Math.atan2(dy, dx) * 180 / Math.PI;
        const absAngle = Math.abs(angle);

        const line = normalizeLine({ x1, y1, x2, y2, len });

        // 거의 수평 또는 약간 기울어진 수평선
        if (absAngle < 16 || absAngle > 164) {
          const yMid = (y1 + y2) / 2;
          if (yMid > h * 0.04 && yMid < h * 0.96) {
            horizontals.push({ ...line, yMid, angle, strength: len });
          }
        }

        // 거의 수직 또는 약간 기울어진 수직선
        if (absAngle > 74 && absAngle < 106) {
          const xMid = (x1 + x2) / 2;
          if (xMid > w * 0.03 && xMid < w * 0.97) {
            verticals.push({ ...line, xMid, angle, strength: len });
          }
        }
      }

      const hLines = mergeSimilarLines(horizontals, "h", Math.round(h * 0.025)).slice(0, 14);
      const vLines = mergeSimilarLines(verticals, "v", Math.round(w * 0.025)).slice(0, 14);

      let best = null;
      let bestScore = -Infinity;

      for (const top of hLines) {
        if (lineYAtX(top, w / 2) > h * 0.45) continue;

        for (const bottom of hLines) {
          if (lineYAtX(bottom, w / 2) < h * 0.50) continue;

          for (const left of vLines) {
            if (lineXAtY(left, h / 2) > w * 0.45) continue;

            for (const right of vLines) {
              if (lineXAtY(right, h / 2) < w * 0.52) continue;

              const tl = intersectInfiniteLines(top, left);
              const tr = intersectInfiniteLines(top, right);
              const br = intersectInfiniteLines(bottom, right);
              const bl = intersectInfiniteLines(bottom, left);

              if (!tl || !tr || !br || !bl) continue;

              const ptsSmall = [tl, tr, br, bl];

              if (!quadInsideImage(ptsSmall, w, h)) continue;

              const bwTop = dist(tl, tr);
              const bwBottom = dist(bl, br);
              const bhLeft = dist(tl, bl);
              const bhRight = dist(tr, br);

              const bw = (bwTop + bwBottom) / 2;
              const bh = (bhLeft + bhRight) / 2;

              if (bw < w * 0.46 || bh < h * 0.38) continue;
              if (bw > w * 0.94 || bh > h * 0.92) continue;

              const ratio = bw / Math.max(1, bh);
              const area = quadArea(ptsSmall);
              const boxRatio = area / (w * h);

              if (boxRatio < 0.20 || boxRatio > 0.88) continue;

              const centerX = (tl.x + tr.x + br.x + bl.x) / 4;
              const centerY = (tl.y + tr.y + br.y + bl.y) / 4;

              const centerScore = 1.25 - Math.min(0.9, Math.abs(centerX - w / 2) / w + Math.abs(centerY - h / 2) / h);
              const ratioScore = pptFrameRatioScoreHough(ratio);
              const sizeScore = Math.min(1.8, boxRatio * 2.25);
              const outerScore = pptOuterPositionScoreHough(w, h, tl, tr, br, bl);
              const parallelScore = pptParallelScore(top, bottom, left, right);

              const lineStrength =
                Math.min(1.5, (top.strength + bottom.strength + left.strength + right.strength) / (w + h));

              const score =
                0.23 * ratioScore +
                0.22 * sizeScore +
                0.20 * outerScore +
                0.15 * centerScore +
                0.12 * parallelScore +
                0.08 * lineStrength;

              if (score > bestScore) {
                bestScore = score;
                best = ptsSmall.map(p => ({ x: p.x / scale, y: p.y / scale }));
              }
            }
          }
        }
      }

      if (!best) {
        return detectPptBySafeGeometryStrong();
      }

      return expandPoints(orderPoints(best), imageW, imageH, 0.002);
    } catch (err) {
      console.warn("sharpened Hough PPT detection failed", err);
      return detectPptBySafeGeometryStrong();
    } finally {
      if (src) src.delete();
      if (gray) gray.delete();
      if (blur) blur.delete();
      if (sharp) sharp.delete();
      if (eq) eq.delete();
      if (edges) edges.delete();
      if (lines) lines.delete();
      if (kernel) kernel.delete();
    }
  }

  function normalizeLine(line) {
    // ax + by + c = 0 형태도 같이 저장
    const { x1, y1, x2, y2 } = line;
    const a = y1 - y2;
    const b = x2 - x1;
    const c = x1 * y2 - x2 * y1;

    return { ...line, a, b, c };
  }

  function mergeSimilarLines(lines, type, threshold) {
    const sorted = lines.slice().sort((a, b) => b.strength - a.strength);
    const out = [];

    for (const line of sorted) {
      const pos = type === "h" ? lineYAtX(line, 500) : lineXAtY(line, 500);

      let merged = false;

      for (const existing of out) {
        const epos = type === "h" ? lineYAtX(existing, 500) : lineXAtY(existing, 500);

        if (Math.abs(pos - epos) < threshold) {
          if (line.strength > existing.strength) {
            Object.assign(existing, line);
          }
          merged = true;
          break;
        }
      }

      if (!merged) out.push({ ...line });
    }

    return out;
  }

  function lineYAtX(line, x) {
    // a x + b y + c = 0
    if (Math.abs(line.b) < 0.0001) return (line.y1 + line.y2) / 2;
    return (-line.a * x - line.c) / line.b;
  }

  function lineXAtY(line, y) {
    if (Math.abs(line.a) < 0.0001) return (line.x1 + line.x2) / 2;
    return (-line.b * y - line.c) / line.a;
  }

  function intersectInfiniteLines(l1, l2) {
    const det = l1.a * l2.b - l2.a * l1.b;
    if (Math.abs(det) < 0.0001) return null;

    const x = (l1.b * l2.c - l2.b * l1.c) / det;
    const y = (l1.c * l2.a - l2.c * l1.a) / det;

    if (!Number.isFinite(x) || !Number.isFinite(y)) return null;
    return { x, y };
  }

  function quadInsideImage(pts, w, h) {
    return pts.every(p =>
      p.x >= -w * 0.03 &&
      p.x <= w * 1.03 &&
      p.y >= -h * 0.03 &&
      p.y <= h * 1.03
    );
  }

  function pptFrameRatioScoreHough(ratio) {
    const targets = [1.20, 1.33, 1.45, 1.60, 1.78];
    let best = 0.35;

    for (const t of targets) {
      const diff = Math.abs(ratio - t);
      if (diff < 0.10) best = Math.max(best, 1.45);
      else if (diff < 0.22) best = Math.max(best, 1.20);
      else if (diff < 0.38) best = Math.max(best, 0.95);
      else if (diff < 0.60) best = Math.max(best, 0.68);
    }

    return best;
  }

  function pptOuterPositionScoreHough(w, h, tl, tr, br, bl) {
    const left = Math.min(tl.x, bl.x);
    const right = Math.max(tr.x, br.x);
    const top = Math.min(tl.y, tr.y);
    const bottom = Math.max(bl.y, br.y);

    let score = 0.58;
    if (left < w * 0.24) score += 0.22;
    if (right > w * 0.70) score += 0.22;
    if (top < h * 0.26) score += 0.20;
    if (bottom > h * 0.66) score += 0.20;

    return Math.min(1.50, score);
  }

  function pptParallelScore(top, bottom, left, right) {
    const hAngleDiff = Math.abs(Math.atan2(top.y2 - top.y1, top.x2 - top.x1) - Math.atan2(bottom.y2 - bottom.y1, bottom.x2 - bottom.x1));
    const vAngleDiff = Math.abs(Math.atan2(left.y2 - left.y1, left.x2 - left.x1) - Math.atan2(right.y2 - right.y1, right.x2 - right.x1));

    const hd = Math.min(hAngleDiff, Math.abs(Math.PI - hAngleDiff));
    const vd = Math.min(vAngleDiff, Math.abs(Math.PI - vAngleDiff));

    return Math.max(0.45, 1.35 - (hd + vd) * 2.2);
  }

  function detectPptBySafeGeometryStrong() {
    // Hough 실패 시 내부 표보다 나은 넓은 PPT 화면 기본값.
    // 사진마다 각도는 다르지만, 최소한 내부 표 오인식보다는 바깥 영역을 잡도록 설정.
    const left = imageW * 0.070;
    const right = imageW * 0.930;
    const top = imageH * 0.105;
    const bottom = imageH * 0.890;

    return [
      { x: left, y: top },
      { x: right, y: top },
      { x: right, y: bottom },
      { x: left, y: bottom }
    ];
  }

  function detectPptSlideByBorderLines() {
    // PPT 슬라이드 테두리선 탐지기.
    // 실패했던 원인: 큰 밝은 영역/컨투어가 내부 표나 회색 작업영역을 잡음.
    // 새 방식: 중앙부에서 길게 이어지는 얇은 수평/수직 테두리 후보를 찾고,
    // 좌우/상하 조합 중 PPT 슬라이드 비율과 위치가 맞는 것을 고른다.
    try {
      const maxSide = 1100;
      const scale = Math.min(maxSide / imageW, maxSide / imageH, 1);
      const w = Math.max(1, Math.round(imageW * scale));
      const h = Math.max(1, Math.round(imageH * scale));

      const temp = document.createElement("canvas");
      temp.width = w;
      temp.height = h;

      const tctx = temp.getContext("2d", { willReadFrequently: true });
      tctx.drawImage(img, 0, 0, w, h);

      const data = tctx.getImageData(0, 0, w, h).data;
      const gray = new Uint8Array(w * h);

      for (let i = 0, p = 0; i < data.length; i += 4, p++) {
        gray[p] = Math.round(0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2]);
      }

      // 수평/수직 긴 선 강도
      const rowScore = new Array(h).fill(0);
      const colScore = new Array(w).fill(0);

      const x0 = Math.round(w * 0.04);
      const x1 = Math.round(w * 0.96);
      const y0 = Math.round(h * 0.05);
      const y1 = Math.round(h * 0.95);

      // 수평 테두리: 위아래 밝기 차이/얇은 선
      for (let y = y0 + 2; y < y1 - 2; y++) {
        let score = 0;

        for (let x = x0; x <= x1; x += 4) {
          const v = gray[y * w + x];
          const up = gray[(y - 2) * w + x];
          const down = gray[(y + 2) * w + x];
          const grad = Math.abs(down - up);

          // 슬라이드 테두리는 보통 중간 밝기 선 + 주변 대비
          if (grad > 10 && v > 95 && v < 235) score++;
        }

        rowScore[y] = score;
      }

      // 수직 테두리
      for (let x = x0 + 2; x < x1 - 2; x++) {
        let score = 0;

        for (let y = y0; y <= y1; y += 4) {
          const v = gray[y * w + x];
          const left = gray[y * w + (x - 2)];
          const right = gray[y * w + (x + 2)];
          const grad = Math.abs(right - left);

          if (grad > 10 && v > 95 && v < 235) score++;
        }

        colScore[x] = score;
      }

      smoothArray(rowScore, 7);
      smoothArray(colScore, 7);

      const rowLines = getStrongLineCandidates(rowScore, w * 0.045, Math.round(h * 0.04));
      const colLines = getStrongLineCandidates(colScore, h * 0.045, Math.round(w * 0.04));

      let best = null;
      let bestScore = -Infinity;

      for (const top of rowLines) {
        if (top.pos > h * 0.45) continue;

        for (const bottom of rowLines) {
          if (bottom.pos < h * 0.50) continue;
          if (bottom.pos - top.pos < h * 0.38) continue;
          if (bottom.pos - top.pos > h * 0.88) continue;

          for (const left of colLines) {
            if (left.pos > w * 0.45) continue;

            for (const right of colLines) {
              if (right.pos < w * 0.52) continue;
              if (right.pos - left.pos < w * 0.45) continue;
              if (right.pos - left.pos > w * 0.92) continue;

              const bw = right.pos - left.pos;
              const bh = bottom.pos - top.pos;
              const ratio = bw / Math.max(1, bh);
              const boxRatio = (bw * bh) / (w * h);

              const ratioScore = pptFrameRatioScore2(ratio);
              const centerScore = 1.15 - Math.min(0.65, Math.abs(((left.pos + right.pos) / 2) - w / 2) / w + Math.abs(((top.pos + bottom.pos) / 2) - h / 2) / h);
              const sizeScore = Math.min(1.6, boxRatio * 2.2);
              const borderContrast = borderContrastScore(gray, w, h, left.pos, top.pos, right.pos, bottom.pos);
              const outerScore = outerPositionScore(w, h, left.pos, top.pos, right.pos, bottom.pos);

              const score =
                0.25 * ratioScore +
                0.22 * sizeScore +
                0.20 * borderContrast +
                0.18 * outerScore +
                0.15 * centerScore;

              if (score > bestScore) {
                bestScore = score;
                best = [
                  { x: left.pos / scale, y: top.pos / scale },
                  { x: right.pos / scale, y: top.pos / scale },
                  { x: right.pos / scale, y: bottom.pos / scale },
                  { x: left.pos / scale, y: bottom.pos / scale }
                ];
              }
            }
          }
        }
      }

      if (!best) {
        // 마지막 보조: 화면 내 PPT 슬라이드 기본 위치값.
        // 자동탐지 실패를 숨기지 않도록 너무 공격적으로 쓰지 않고, 최소 안전 범위만 반환.
        return detectPptBySafeGeometry();
      }

      return expandPoints(best, imageW, imageH, 0.002);
    } catch (err) {
      console.warn("PPT border line detection failed", err);
      return detectPptBySafeGeometry();
    }
  }

  function getStrongLineCandidates(arr, minScore, mergeDistance) {
    const candidates = [];
    let start = -1;
    let bestPos = -1;
    let bestVal = -Infinity;

    for (let i = 0; i <= arr.length; i++) {
      const active = i < arr.length && arr[i] >= minScore;

      if (active) {
        if (start < 0) {
          start = i;
          bestPos = i;
          bestVal = arr[i];
        }

        if (arr[i] > bestVal) {
          bestVal = arr[i];
          bestPos = i;
        }
      }

      if ((!active || i === arr.length) && start >= 0) {
        candidates.push({ pos: bestPos, val: bestVal });
        start = -1;
        bestPos = -1;
        bestVal = -Infinity;
      }
    }

    candidates.sort((a, b) => b.val - a.val);

    const merged = [];
    for (const cand of candidates) {
      if (merged.every(m => Math.abs(m.pos - cand.pos) > mergeDistance)) {
        merged.push(cand);
      }
    }

    return merged.slice(0, 10);
  }

  function pptFrameRatioScore2(ratio) {
    const targets = [1.20, 1.33, 1.45, 1.60, 1.78];
    let best = 0.35;

    for (const t of targets) {
      const diff = Math.abs(ratio - t);
      if (diff < 0.10) best = Math.max(best, 1.45);
      else if (diff < 0.22) best = Math.max(best, 1.20);
      else if (diff < 0.38) best = Math.max(best, 0.90);
      else if (diff < 0.58) best = Math.max(best, 0.65);
    }

    return best;
  }

  function borderContrastScore(gray, w, h, left, top, right, bottom) {
    const insideL = meanGrayColArray2(gray, w, h, left + 8, top, bottom);
    const outsideL = meanGrayColArray2(gray, w, h, left - 8, top, bottom);
    const insideR = meanGrayColArray2(gray, w, h, right - 8, top, bottom);
    const outsideR = meanGrayColArray2(gray, w, h, right + 8, top, bottom);
    const insideT = meanGrayRowArray2(gray, w, h, top + 8, left, right);
    const outsideT = meanGrayRowArray2(gray, w, h, top - 8, left, right);
    const insideB = meanGrayRowArray2(gray, w, h, bottom - 8, left, right);
    const outsideB = meanGrayRowArray2(gray, w, h, bottom + 8, left, right);

    const diff =
      Math.max(0, insideL - outsideL) +
      Math.max(0, insideR - outsideR) +
      Math.max(0, insideT - outsideT) +
      Math.max(0, insideB - outsideB);

    return Math.min(1.5, diff / 100);
  }

  function outerPositionScore(w, h, left, top, right, bottom) {
    // 내부 표보다 바깥 슬라이드를 선호.
    let score = 0.7;
    if (left < w * 0.22) score += 0.18;
    if (right > w * 0.72) score += 0.18;
    if (top < h * 0.25) score += 0.16;
    if (bottom > h * 0.68) score += 0.16;
    return Math.min(1.45, score);
  }

  function meanGrayColArray2(gray, w, h, x, y0, y1) {
    x = clamp(Math.round(x), 0, w - 1);
    y0 = clamp(Math.round(y0), 0, h - 1);
    y1 = clamp(Math.round(y1), 0, h - 1);

    let sum = 0;
    let count = 0;

    for (let y = y0; y <= y1; y += 8) {
      sum += gray[y * w + x];
      count++;
    }

    return count ? sum / count : 0;
  }

  function meanGrayRowArray2(gray, w, h, y, x0, x1) {
    y = clamp(Math.round(y), 0, h - 1);
    x0 = clamp(Math.round(x0), 0, w - 1);
    x1 = clamp(Math.round(x1), 0, w - 1);

    let sum = 0;
    let count = 0;

    for (let x = x0; x <= x1; x += 8) {
      sum += gray[y * w + x];
      count++;
    }

    return count ? sum / count : 0;
  }

  function detectPptBySafeGeometry() {
    // 현재 샘플들이 모두 PPT 화면 촬영이라는 전제의 안전 기하값.
    // 내부 표를 잡는 것보다 낫도록, 흰 슬라이드가 위치하는 넓은 영역을 반환.
    const left = imageW * 0.075;
    const right = imageW * 0.925;
    const top = imageH * 0.105;
    const bottom = imageH * 0.885;

    return [
      { x: left, y: top },
      { x: right, y: top },
      { x: right, y: bottom },
      { x: left, y: bottom }
    ];
  }

  function detectPptSlideFrame() {
    // PPT 슬라이드 전용 탐지기.
    // 핵심 아이디어:
    // - 내부 표/텍스트 사각형보다 훨씬 바깥쪽에 있는 큰 밝은 사각형을 찾는다.
    // - 회색 작업영역과 흰 슬라이드의 밝기 차이를 이용한다.
    // - 좌/우/상/하 방향에서 "밝은 영역이 넓게 지속되는 마지막 경계"를 찾는다.
    try {
      const maxSide = 1000;
      const scale = Math.min(maxSide / imageW, maxSide / imageH, 1);
      const w = Math.max(1, Math.round(imageW * scale));
      const h = Math.max(1, Math.round(imageH * scale));

      const temp = document.createElement("canvas");
      temp.width = w;
      temp.height = h;

      const tctx = temp.getContext("2d", { willReadFrequently: true });
      tctx.drawImage(img, 0, 0, w, h);

      const data = tctx.getImageData(0, 0, w, h).data;

      // 밝기 배열
      const gray = new Uint8Array(w * h);
      for (let i = 0, p = 0; i < data.length; i += 4, p++) {
        gray[p] = Math.round(0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2]);
      }

      // 회색 바탕/흰 슬라이드 차이 기준.
      // 기존 콘솔값: 회색 126~160, 흰 슬라이드 220 근처.
      const brightMin = 178;

      // 슬라이드는 대체로 화면 중앙부에 있으므로 중앙 영역 기준으로 투영한다.
      const yTopScan = Math.round(h * 0.08);
      const yBottomScan = Math.round(h * 0.92);
      const xLeftScan = Math.round(w * 0.06);
      const xRightScan = Math.round(w * 0.94);

      const colBright = new Array(w).fill(0);
      const rowBright = new Array(h).fill(0);

      for (let y = yTopScan; y <= yBottomScan; y += 3) {
        for (let x = xLeftScan; x <= xRightScan; x += 3) {
          const v = gray[y * w + x];

          // 너무 새까만 상태바/리본은 제외, 밝은 슬라이드 계열만 카운트
          if (v >= brightMin) {
            colBright[x] += 3;
            rowBright[y] += 3;
          }
        }
      }

      smoothArray(colBright, 11);
      smoothArray(rowBright, 11);

      // 바깥 슬라이드 후보: 내부 표보다 넓은 영역이어야 함.
      const xRanges = getAllRangesFromProjectionLoose(colBright, h * 0.20, Math.round(w * 0.38));
      const yRanges = getAllRangesFromProjectionLoose(rowBright, w * 0.22, Math.round(h * 0.35));

      let best = null;
      let bestScore = -Infinity;

      for (const xr of xRanges) {
        for (const yr of yRanges) {
          const bw = xr.end - xr.start + 1;
          const bh = yr.end - yr.start + 1;
          const boxRatio = (bw * bh) / (w * h);

          if (bw < w * 0.45 || bh < h * 0.42) continue;
          if (boxRatio < 0.20 || boxRatio > 0.96) continue;

          const pts = [
            { x: xr.start / scale, y: yr.start / scale },
            { x: xr.end / scale, y: yr.start / scale },
            { x: xr.end / scale, y: yr.end / scale },
            { x: xr.start / scale, y: yr.end / scale }
          ];

          const q = orderPoints(pts);
          const ratio = quadWidthHeightRatioSafe(q);
          const center = centerBiasScore(q);
          const size = Math.min(1.8, boxRatio * 2.1);
          const ratioScore = pptFrameRatioScore(ratio);
          const borderScore = estimatePptOuterBorderScore(gray, w, h, xr, yr);

          // 내부 표 배제:
          // 내부 표는 보통 면적이 작고, 중앙에 과하게 몰려 있으며,
          // 외곽 경계가 약하거나 아래/위 여백이 부족하다.
          const topMarginScore = yr.start < h * 0.18 ? 1.15 : 0.75;
          const bottomMarginScore = yr.end > h * 0.70 ? 1.15 : 0.75;
          const leftMarginScore = xr.start < w * 0.18 ? 1.10 : 0.76;
          const rightMarginScore = xr.end > w * 0.75 ? 1.10 : 0.76;

          const score =
            0.28 * size +
            0.18 * center +
            0.18 * ratioScore +
            0.18 * borderScore +
            0.06 * topMarginScore +
            0.06 * bottomMarginScore +
            0.03 * leftMarginScore +
            0.03 * rightMarginScore;

          if (score > bestScore) {
            bestScore = score;
            best = q;
          }
        }
      }

      if (!best) {
        // 투영 실패 시 OpenCV 컨투어가 있으면 보조로 사용하되,
        // 내부 표를 잡는 경향이 있으므로 바깥 확장 시도
        if (typeof detectDocumentByContourScanner === "function") {
          const c = detectDocumentByContourScanner();
          if (c) return expandPptFrameOutward(c);
        }
        return null;
      }

      return expandPptFrameOutward(best) || expandPoints(best, imageW, imageH, 0.006);
    } catch (err) {
      console.warn("PPT slide frame detection failed", err);
      return null;
    }
  }

  function getAllRangesFromProjectionLoose(arr, threshold, minLen) {
    const ranges = [];
    let start = -1;

    for (let i = 0; i <= arr.length; i++) {
      const active = i < arr.length && arr[i] >= threshold;

      if (active && start < 0) {
        start = i;
      }

      if ((!active || i === arr.length) && start >= 0) {
        const end = i - 1;
        const len = end - start + 1;

        if (len >= minLen) {
          ranges.push({ start, end, len });
        }

        start = -1;
      }
    }

    ranges.sort((a, b) => b.len - a.len);
    return ranges.slice(0, 8);
  }

  function quadWidthHeightRatioSafe(q) {
    q = orderPoints(q);
    const top = dist(q[0], q[1]);
    const bottom = dist(q[3], q[2]);
    const left = dist(q[0], q[3]);
    const right = dist(q[1], q[2]);
    const ww = Math.max(1, (top + bottom) / 2);
    const hh = Math.max(1, (left + right) / 2);
    return ww / hh;
  }

  function pptFrameRatioScore(ratio) {
    // 촬영된 PPT 영역은 4:3, 16:9, 또는 촬영왜곡 때문에 1.2~1.8 사이가 많음.
    const targets = [1.20, 1.33, 1.45, 1.60, 1.78];
    let best = 0.50;

    for (const t of targets) {
      const diff = Math.abs(ratio - t);
      if (diff < 0.12) best = Math.max(best, 1.35);
      else if (diff < 0.25) best = Math.max(best, 1.12);
      else if (diff < 0.42) best = Math.max(best, 0.90);
      else if (diff < 0.65) best = Math.max(best, 0.70);
    }

    return best;
  }

  function estimatePptOuterBorderScore(gray, w, h, xr, yr) {
    // 후보 바깥쪽이 회색/어둡고, 안쪽이 밝으면 슬라이드 외곽일 가능성이 높다.
    const x0 = clamp(xr.start, 1, w - 2);
    const x1 = clamp(xr.end, 1, w - 2);
    const y0 = clamp(yr.start, 1, h - 2);
    const y1 = clamp(yr.end, 1, h - 2);

    const insideLeft = meanGrayColArray(gray, w, h, x0 + 8, y0, y1);
    const outsideLeft = meanGrayColArray(gray, w, h, x0 - 8, y0, y1);
    const insideRight = meanGrayColArray(gray, w, h, x1 - 8, y0, y1);
    const outsideRight = meanGrayColArray(gray, w, h, x1 + 8, y0, y1);
    const insideTop = meanGrayRowArray(gray, w, h, y0 + 8, x0, x1);
    const outsideTop = meanGrayRowArray(gray, w, h, y0 - 8, x0, x1);
    const insideBottom = meanGrayRowArray(gray, w, h, y1 - 8, x0, x1);
    const outsideBottom = meanGrayRowArray(gray, w, h, y1 + 8, x0, x1);

    const diff =
      Math.max(0, insideLeft - outsideLeft) +
      Math.max(0, insideRight - outsideRight) +
      Math.max(0, insideTop - outsideTop) +
      Math.max(0, insideBottom - outsideBottom);

    return Math.min(1.5, diff / 120);
  }

  function meanGrayColArray(gray, w, h, x, y0, y1) {
    x = clamp(Math.round(x), 0, w - 1);
    y0 = clamp(Math.round(y0), 0, h - 1);
    y1 = clamp(Math.round(y1), 0, h - 1);

    let sum = 0;
    let count = 0;

    for (let y = y0; y <= y1; y += 6) {
      sum += gray[y * w + x];
      count++;
    }

    return count ? sum / count : 0;
  }

  function meanGrayRowArray(gray, w, h, y, x0, x1) {
    y = clamp(Math.round(y), 0, h - 1);
    x0 = clamp(Math.round(x0), 0, w - 1);
    x1 = clamp(Math.round(x1), 0, w - 1);

    let sum = 0;
    let count = 0;

    for (let x = x0; x <= x1; x += 6) {
      sum += gray[y * w + x];
      count++;
    }

    return count ? sum / count : 0;
  }

  function expandPptFrameOutward(seedPoints) {
    // seed가 내부 표를 잡은 경우, 바깥쪽 밝은 슬라이드 경계까지 확장한다.
    try {
      const maxSide = 900;
      const scale = Math.min(maxSide / imageW, maxSide / imageH, 1);
      const w = Math.max(1, Math.round(imageW * scale));
      const h = Math.max(1, Math.round(imageH * scale));

      const temp = document.createElement("canvas");
      temp.width = w;
      temp.height = h;
      const tctx = temp.getContext("2d", { willReadFrequently: true });
      tctx.drawImage(img, 0, 0, w, h);
      const data = tctx.getImageData(0, 0, w, h).data;

      const gray = new Uint8Array(w * h);
      for (let i = 0, p = 0; i < data.length; i += 4, p++) {
        gray[p] = Math.round(0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2]);
      }

      const q = orderPoints(seedPoints).map(p => ({ x: p.x * scale, y: p.y * scale }));
      const cx = Math.round((q[0].x + q[1].x + q[2].x + q[3].x) / 4);
      const cy = Math.round((q[0].y + q[1].y + q[2].y + q[3].y) / 4);

      const brightMin = 172;

      const left = scanOutToGrayX(gray, w, h, cx, cy, -1, brightMin);
      const right = scanOutToGrayX(gray, w, h, cx, cy, 1, brightMin);
      const top = scanOutToGrayY(gray, w, h, cx, cy, -1, brightMin);
      const bottom = scanOutToGrayY(gray, w, h, cx, cy, 1, brightMin);

      if (left === null || right === null || top === null || bottom === null) return null;
      if (right - left < w * 0.45 || bottom - top < h * 0.40) return null;
      if (right - left > w * 0.98 || bottom - top > h * 0.98) return null;

      return expandPoints([
        { x: left / scale, y: top / scale },
        { x: right / scale, y: top / scale },
        { x: right / scale, y: bottom / scale },
        { x: left / scale, y: bottom / scale }
      ], imageW, imageH, 0.004);
    } catch (err) {
      console.warn("expand PPT frame failed", err);
      return null;
    }
  }

  function scanOutToGrayX(gray, w, h, startX, centerY, dir, brightMin) {
    let lastBright = null;
    let grayRun = 0;
    const y0 = Math.round(h * 0.15);
    const y1 = Math.round(h * 0.88);

    for (let x = startX; x > 2 && x < w - 3; x += dir * 2) {
      const v = meanGrayColArray(gray, w, h, x, y0, y1);

      if (v >= brightMin) {
        lastBright = x;
        grayRun = 0;
      } else if (lastBright !== null) {
        grayRun++;
        if (grayRun >= 5) return lastBright;
      }
    }

    return lastBright;
  }

  function scanOutToGrayY(gray, w, h, centerX, startY, dir, brightMin) {
    let lastBright = null;
    let grayRun = 0;
    const x0 = Math.round(w * 0.10);
    const x1 = Math.round(w * 0.92);

    for (let y = startY; y > 2 && y < h - 3; y += dir * 2) {
      const v = meanGrayRowArray(gray, w, h, y, x0, x1);

      if (v >= brightMin) {
        lastBright = y;
        grayRun = 0;
      } else if (lastBright !== null) {
        grayRun++;
        if (grayRun >= 5) return lastBright;
      }
    }

    return lastBright;
  }

  function detectDocumentByJscanifyScanner() {
    // jscanify는 웹/브라우저에서 동작하는 OpenCV.js 기반 문서 스캐너.
    // 단, 내부 표를 잡을 수 있으므로 결과를 바로 쓰지 않고 바깥 슬라이드 경계로 확장한다.
    if (!window.cvReady || typeof cv === "undefined" || typeof jscanify === "undefined") {
      return null;
    }

    let mat = null;
    let contour = null;

    try {
      const maxSide = 1100;
      const scale = Math.min(maxSide / imageW, maxSide / imageH, 1);
      const w = Math.max(1, Math.round(imageW * scale));
      const h = Math.max(1, Math.round(imageH * scale));

      const temp = document.createElement("canvas");
      temp.width = w;
      temp.height = h;

      const tctx = temp.getContext("2d", { willReadFrequently: true });
      tctx.drawImage(img, 0, 0, w, h);

      const scanner = new jscanify();
      mat = cv.imread(temp);
      contour = scanner.findPaperContour(mat);

      if (!contour) return null;

      const corners = scanner.getCornerPoints(contour);
      if (!corners) return null;

      const {
        topLeftCorner,
        topRightCorner,
        bottomRightCorner,
        bottomLeftCorner
      } = corners;

      if (!topLeftCorner || !topRightCorner || !bottomRightCorner || !bottomLeftCorner) {
        return null;
      }

      let pts = [
        { x: topLeftCorner.x / scale, y: topLeftCorner.y / scale },
        { x: topRightCorner.x / scale, y: topRightCorner.y / scale },
        { x: bottomRightCorner.x / scale, y: bottomRightCorner.y / scale },
        { x: bottomLeftCorner.x / scale, y: bottomLeftCorner.y / scale }
      ];

      pts = orderPoints(pts);

      // 내부 표를 잡은 경우를 대비해서, 회색 바탕/흰 슬라이드 외곽까지 확장.
      const refined = refineCandidateToOuterWhiteSlide(pts);
      return refined || pts;
    } catch (err) {
      console.warn("jscanify detection failed", err);
      return null;
    } finally {
      if (contour) contour.delete();
      if (mat) mat.delete();
    }
  }

  function refineCandidateToOuterWhiteSlide(seedPoints) {
    // 핵심:
    // seed가 내부 표/본문이어도, 그 주변에서 바깥으로 이동하며
    // 흰 슬라이드 영역이 끝나고 회색 바탕이 시작되는 경계를 찾는다.
    try {
      const maxSide = 900;
      const scale = Math.min(maxSide / imageW, maxSide / imageH, 1);
      const w = Math.max(1, Math.round(imageW * scale));
      const h = Math.max(1, Math.round(imageH * scale));

      const temp = document.createElement("canvas");
      temp.width = w;
      temp.height = h;

      const tctx = temp.getContext("2d", { willReadFrequently: true });
      tctx.drawImage(img, 0, 0, w, h);

      const data = tctx.getImageData(0, 0, w, h).data;

      const q = orderPoints(seedPoints).map(p => ({
        x: p.x * scale,
        y: p.y * scale
      }));

      const sx0 = clamp(Math.round(Math.min(q[0].x, q[3].x)), 0, w - 1);
      const sx1 = clamp(Math.round(Math.max(q[1].x, q[2].x)), 0, w - 1);
      const sy0 = clamp(Math.round(Math.min(q[0].y, q[1].y)), 0, h - 1);
      const sy1 = clamp(Math.round(Math.max(q[2].y, q[3].y)), 0, h - 1);

      const centerX = Math.round((sx0 + sx1) / 2);
      const centerY = Math.round((sy0 + sy1) / 2);

      // 흰 슬라이드 기준. 콘솔 샘플에서 흰색은 약 220, 회색은 126~160이었다.
      const whiteMin = 176;

      const left = findOuterWhiteBoundaryX(data, w, h, centerX, sy0, sy1, -1, whiteMin);
      const right = findOuterWhiteBoundaryX(data, w, h, centerX, sy0, sy1, 1, whiteMin);
      const top = findOuterWhiteBoundaryY(data, w, h, centerY, sx0, sx1, -1, whiteMin);
      const bottom = findOuterWhiteBoundaryY(data, w, h, centerY, sx0, sx1, 1, whiteMin);

      if (left === null || right === null || top === null || bottom === null) {
        return null;
      }

      if (right - left < w * 0.48 || bottom - top < h * 0.38) {
        return null;
      }

      // 화면 전체를 다 잡는 사고 방지
      if (right - left > w * 0.98 || bottom - top > h * 0.98) {
        return null;
      }

      return expandPoints([
        { x: left / scale, y: top / scale },
        { x: right / scale, y: top / scale },
        { x: right / scale, y: bottom / scale },
        { x: left / scale, y: bottom / scale }
      ], imageW, imageH, 0.003);
    } catch (err) {
      console.warn("outer slide refine failed", err);
      return null;
    }
  }

  function meanGrayColumn(data, w, h, x, y0, y1) {
    x = clamp(Math.round(x), 0, w - 1);
    y0 = clamp(Math.round(y0), 0, h - 1);
    y1 = clamp(Math.round(y1), 0, h - 1);

    let sum = 0;
    let count = 0;

    for (let y = y0; y <= y1; y += 6) {
      const i = (y * w + x) * 4;
      sum += (data[i] + data[i + 1] + data[i + 2]) / 3;
      count++;
    }

    return count ? sum / count : 0;
  }

  function meanGrayRow(data, w, h, y, x0, x1) {
    y = clamp(Math.round(y), 0, h - 1);
    x0 = clamp(Math.round(x0), 0, w - 1);
    x1 = clamp(Math.round(x1), 0, w - 1);

    let sum = 0;
    let count = 0;

    for (let x = x0; x <= x1; x += 6) {
      const i = (y * w + x) * 4;
      sum += (data[i] + data[i + 1] + data[i + 2]) / 3;
      count++;
    }

    return count ? sum / count : 0;
  }

  function findOuterWhiteBoundaryX(data, w, h, startX, y0, y1, dir, whiteMin) {
    let lastWhite = null;
    let grayRun = 0;

    for (let x = startX; x > 1 && x < w - 2; x += dir * 2) {
      const v = meanGrayColumn(data, w, h, x, y0, y1);

      if (v >= whiteMin) {
        lastWhite = x;
        grayRun = 0;
      } else if (lastWhite !== null) {
        grayRun++;

        // 회색이 연속으로 나오면 직전 흰 구간이 슬라이드 경계
        if (grayRun >= 5) {
          return clamp(lastWhite, 0, w - 1);
        }
      }
    }

    return lastWhite;
  }

  function findOuterWhiteBoundaryY(data, w, h, startY, x0, x1, dir, whiteMin) {
    let lastWhite = null;
    let grayRun = 0;

    for (let y = startY; y > 1 && y < h - 2; y += dir * 2) {
      const v = meanGrayRow(data, w, h, y, x0, x1);

      if (v >= whiteMin) {
        lastWhite = y;
        grayRun = 0;
      } else if (lastWhite !== null) {
        grayRun++;

        if (grayRun >= 5) {
          return clamp(lastWhite, 0, h - 1);
        }
      }
    }

    return lastWhite;
  }

  function detectDocumentByContourScanner() {
    // 외곽선 기반 문서 탐지.
    // 원리:
    // 1) 흑백 변환
    // 2) Canny edge
    // 3) morphology close/dilate로 끊긴 슬라이드 외곽선 연결
    // 4) 큰 사각형 contour 중 PPT 슬라이드에 가장 가까운 것 선택
    if (!window.cvReady || typeof cv === "undefined") {
      console.warn("OpenCV not ready");
      return null;
    }

    let src = null;
    let gray = null;
    let blur = null;
    let edges = null;
    let closed = null;
    let kernelClose = null;
    let kernelDilate = null;
    let contours = null;
    let hierarchy = null;

    try {
      const maxSide = 1000;
      const scale = Math.min(maxSide / imageW, maxSide / imageH, 1);
      const w = Math.max(1, Math.round(imageW * scale));
      const h = Math.max(1, Math.round(imageH * scale));

      const temp = document.createElement("canvas");
      temp.width = w;
      temp.height = h;
      const tctx = temp.getContext("2d", { willReadFrequently: true });
      tctx.drawImage(img, 0, 0, w, h);

      src = cv.imread(temp);
      gray = new cv.Mat();
      blur = new cv.Mat();
      edges = new cv.Mat();
      closed = new cv.Mat();
      kernelClose = cv.Mat.ones(11, 11, cv.CV_8U);
      kernelDilate = cv.Mat.ones(3, 3, cv.CV_8U);
      contours = new cv.MatVector();
      hierarchy = new cv.Mat();

      cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
      cv.GaussianBlur(gray, blur, new cv.Size(5, 5), 0);

      // PPT 슬라이드 외곽선은 약하지만 길게 이어져 있음.
      cv.Canny(blur, edges, 20, 75);
      cv.morphologyEx(edges, closed, cv.MORPH_CLOSE, kernelClose);
      cv.dilate(closed, closed, kernelDilate);

      cv.findContours(closed, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

      const imageArea = w * h;
      let best = null;
      let bestScore = -Infinity;

      for (let i = 0; i < contours.size(); i++) {
        const cnt = contours.get(i);
        const area = cv.contourArea(cnt);
        const rect = cv.boundingRect(cnt);

        const bw = rect.width;
        const bh = rect.height;
        const boxArea = bw * bh;
        const boxRatio = boxArea / imageArea;

        // 너무 작거나 화면 전체에 가까운 후보 제거
        if (bw < w * 0.45 || bh < h * 0.38 || boxRatio < 0.18 || boxRatio > 0.96) {
          cnt.delete();
          continue;
        }

        const peri = cv.arcLength(cnt, true);
        const approx = new cv.Mat();

        for (const eps of [0.01, 0.015, 0.02, 0.03, 0.045, 0.06]) {
          cv.approxPolyDP(cnt, approx, eps * peri, true);

          let pts;

          if (approx.rows === 4) {
            pts = matToPoints(approx).map(p => ({ x: p.x / scale, y: p.y / scale }));
          } else {
            // 4각형 근사가 안 되면 boundingRect 후보도 검토
            pts = [
              { x: rect.x / scale, y: rect.y / scale },
              { x: (rect.x + rect.width) / scale, y: rect.y / scale },
              { x: (rect.x + rect.width) / scale, y: (rect.y + rect.height) / scale },
              { x: rect.x / scale, y: (rect.y + rect.height) / scale }
            ];
          }

          pts = expandPoints(orderPoints(pts), imageW, imageH, 0.004);

          const q = orderPoints(pts);
          const ratio = quadWidthHeightRatio(q);
          const areaScore = Math.min(1.7, quadArea(q) / (imageW * imageH) * 2.0);
          const rectScore = rectangleScore(q);
          const centerScore = centerBiasScore(q);
          const ratioScore = pptSlideRatioScore(ratio);
          const whiteness = estimateInsideWhiteness(temp, q, scale);

          const score =
            0.30 * areaScore +
            0.25 * rectScore +
            0.18 * centerScore +
            0.15 * ratioScore +
            0.12 * whiteness;

          if (score > bestScore) {
            bestScore = score;
            best = q;
          }
        }

        approx.delete();
        cnt.delete();
      }

      // contour가 약해서 실패하면 선 투영 방식으로 한 번 더 시도
      if (!best) {
        best = detectDocumentByLineProjection(temp, scale);
      }

      return best;
    } catch (err) {
      console.warn("contour document detection failed", err);
      return null;
    } finally {
      if (src) src.delete();
      if (gray) gray.delete();
      if (blur) blur.delete();
      if (edges) edges.delete();
      if (closed) closed.delete();
      if (kernelClose) kernelClose.delete();
      if (kernelDilate) kernelDilate.delete();
      if (contours) contours.delete();
      if (hierarchy) hierarchy.delete();
    }
  }

  function quadWidthHeightRatio(q) {
    q = orderPoints(q);
    const top = dist(q[0], q[1]);
    const bottom = dist(q[3], q[2]);
    const left = dist(q[0], q[3]);
    const right = dist(q[1], q[2]);
    const ww = Math.max(1, (top + bottom) / 2);
    const hh = Math.max(1, (left + right) / 2);
    return ww / hh;
  }

  function pptSlideRatioScore(ratio) {
    // PPT 슬라이드/모니터 촬영 문서는 대체로 가로형 1.25~1.8 근처.
    const targets = [1.25, 1.33, 1.45, 1.6, 1.78];
    let best = 0.4;

    for (const t of targets) {
      const diff = Math.abs(ratio - t);
      if (diff < 0.10) best = Math.max(best, 1.45);
      else if (diff < 0.20) best = Math.max(best, 1.25);
      else if (diff < 0.35) best = Math.max(best, 1.0);
      else if (diff < 0.55) best = Math.max(best, 0.75);
    }

    return best;
  }

  function estimateInsideWhiteness(canvasEl, q, scale) {
    const c = canvasEl.getContext("2d", { willReadFrequently: true });
    const w = canvasEl.width;
    const h = canvasEl.height;
    const data = c.getImageData(0, 0, w, h).data;

    const xs = q.map(p => p.x * scale);
    const ys = q.map(p => p.y * scale);

    const x0 = clamp(Math.round(Math.min(...xs)), 0, w - 1);
    const x1 = clamp(Math.round(Math.max(...xs)), 0, w - 1);
    const y0 = clamp(Math.round(Math.min(...ys)), 0, h - 1);
    const y1 = clamp(Math.round(Math.max(...ys)), 0, h - 1);

    let bright = 0;
    let total = 0;

    for (let y = y0; y <= y1; y += 8) {
      for (let x = x0; x <= x1; x += 8) {
        const i = (y * w + x) * 4;
        const v = (data[i] + data[i + 1] + data[i + 2]) / 3;
        if (v > 175) bright++;
        total++;
      }
    }

    if (!total) return 0.5;
    return Math.min(1.4, bright / total * 1.6);
  }

  function detectDocumentByLineProjection(canvasEl, scale) {
    // contour 실패시 백업: 긴 수평/수직 경계를 투영으로 찾음.
    const c = canvasEl.getContext("2d", { willReadFrequently: true });
    const w = canvasEl.width;
    const h = canvasEl.height;
    const data = c.getImageData(0, 0, w, h).data;

    const rowEdge = new Array(h).fill(0);
    const colEdge = new Array(w).fill(0);

    for (let y = 2; y < h - 2; y++) {
      for (let x = 2; x < w - 2; x++) {
        const idx = (y * w + x) * 4;
        const v = (data[idx] + data[idx + 1] + data[idx + 2]) / 3;

        const idxR = (y * w + (x + 2)) * 4;
        const idxL = (y * w + (x - 2)) * 4;
        const idxD = ((y + 2) * w + x) * 4;
        const idxU = ((y - 2) * w + x) * 4;

        const vr = (data[idxR] + data[idxR + 1] + data[idxR + 2]) / 3;
        const vl = (data[idxL] + data[idxL + 1] + data[idxL + 2]) / 3;
        const vd = (data[idxD] + data[idxD + 1] + data[idxD + 2]) / 3;
        const vu = (data[idxU] + data[idxU + 1] + data[idxU + 2]) / 3;

        const gx = Math.abs(vr - vl);
        const gy = Math.abs(vd - vu);

        if (gy > 16 && v > 105) rowEdge[y]++;
        if (gx > 16 && v > 105) colEdge[x]++;
      }
    }

    smoothArray(rowEdge, 9);
    smoothArray(colEdge, 9);

    const top = firstStrongLine(rowEdge, h * 0.03, h * 0.35, w * 0.22);
    const bottom = lastStrongLine(rowEdge, h * 0.55, h * 0.96, w * 0.22);
    const left = firstStrongLine(colEdge, w * 0.02, w * 0.35, h * 0.20);
    const right = lastStrongLine(colEdge, w * 0.60, w * 0.98, h * 0.20);

    if (top === null || bottom === null || left === null || right === null) return null;
    if (right - left < w * 0.45 || bottom - top < h * 0.35) return null;

    return [
      { x: left / scale, y: top / scale },
      { x: right / scale, y: top / scale },
      { x: right / scale, y: bottom / scale },
      { x: left / scale, y: bottom / scale }
    ];
  }

  function firstStrongLine(arr, from, to, threshold) {
    from = Math.max(0, Math.round(from));
    to = Math.min(arr.length - 1, Math.round(to));

    for (let i = from; i <= to; i++) {
      if (arr[i] >= threshold) return i;
    }

    return null;
  }

  function lastStrongLine(arr, from, to, threshold) {
    from = Math.max(0, Math.round(from));
    to = Math.min(arr.length - 1, Math.round(to));

    for (let i = to; i >= from; i--) {
      if (arr[i] >= threshold) return i;
    }

    return null;
  }

  function makeCenterCropCandidates() {
    const candidates = [];
    const specs = [
      { label: "중앙 넓은 사각", w: 0.90, h: 0.72, score: 0.16 },
      { label: "중앙 표 영역", w: 0.86, h: 0.58, score: 0.14 },
      { label: "중앙 A4 가로", w: 0.84, h: 0.59, score: 0.12 },
      { label: "중앙 A4 세로", w: 0.58, h: 0.82, score: 0.10 }
    ];

    for (const s of specs) {
      const bw = imageW * s.w;
      const bh = imageH * s.h;
      const left = (imageW - bw) / 2;
      const top = (imageH - bh) / 2;

      candidates.push({
        label: s.label,
        score: s.score,
        points: [
          { x: left, y: top },
          { x: left + bw, y: top },
          { x: left + bw, y: top + bh },
          { x: left, y: top + bh }
        ]
      });
    }

    return candidates;
  }

  function closeMask(mask, w, h, iterations) {
    for (let k = 0; k < iterations; k++) dilateMask(mask, w, h);
    for (let k = 0; k < iterations; k++) erodeMask(mask, w, h);
  }

  function dilateMask(mask, w, h) {
    const copy = mask.slice();

    for (let y = 1; y < h - 1; y++) {
      for (let x = 1; x < w - 1; x++) {
        const idx = y * w + x;
        if (copy[idx]) continue;

        if (
          copy[idx - 1] || copy[idx + 1] ||
          copy[idx - w] || copy[idx + w] ||
          copy[idx - w - 1] || copy[idx - w + 1] ||
          copy[idx + w - 1] || copy[idx + w + 1]
        ) mask[idx] = 1;
      }
    }
  }

  function erodeMask(mask, w, h) {
    const copy = mask.slice();

    for (let y = 1; y < h - 1; y++) {
      for (let x = 1; x < w - 1; x++) {
        const idx = y * w + x;
        if (!copy[idx]) continue;

        if (!copy[idx - 1] || !copy[idx + 1] || !copy[idx - w] || !copy[idx + w]) {
          mask[idx] = 0;
        }
      }
    }
  }

  function removeIsolatedNoise(mask, w, h) {
    const copy = mask.slice();

    for (let y = 2; y < h - 2; y++) {
      for (let x = 2; x < w - 2; x++) {
        const idx = y * w + x;
        if (!copy[idx]) continue;

        let count = 0;
        for (let yy = -2; yy <= 2; yy++) {
          for (let xx = -2; xx <= 2; xx++) {
            count += copy[(y + yy) * w + (x + xx)];
          }
        }

        if (count <= 5) mask[idx] = 0;
      }
    }
  }

  function connectedComponents(mask, w, h, maxComponents) {
    const visited = new Uint8Array(w * h);
    const comps = [];

    for (let y = 0; y < h; y += 2) {
      for (let x = 0; x < w; x += 2) {
        const start = y * w + x;
        if (!mask[start] || visited[start]) continue;

        const queue = [start];
        visited[start] = 1;

        let head = 0;
        let minX = x, maxX = x, minY = y, maxY = y;
        let count = 0;

        while (head < queue.length) {
          const idx = queue[head++];
          const cx = idx % w;
          const cy = Math.floor(idx / w);

          count++;
          if (cx < minX) minX = cx;
          if (cx > maxX) maxX = cx;
          if (cy < minY) minY = cy;
          if (cy > maxY) maxY = cy;

          const neighbors = [idx - 1, idx + 1, idx - w, idx + w];

          for (const n of neighbors) {
            if (n < 0 || n >= mask.length) continue;
            if (visited[n] || !mask[n]) continue;

            const nx = n % w;
            const ny = Math.floor(n / w);
            if (Math.abs(nx - cx) + Math.abs(ny - cy) !== 1) continue;

            visited[n] = 1;
            queue.push(n);
          }
        }

        if (count > w * h * 0.010) comps.push({ minX, minY, maxX, maxY, count });
      }
    }

    comps.sort((a, b) => b.count - a.count);
    return comps.slice(0, maxComponents);
  }

  function getRangesFromProjection(arr, threshold, totalLen) {
    const ranges = [];
    let inRange = false;
    let start = 0;

    for (let i = 0; i < arr.length; i++) {
      if (!inRange && arr[i] > threshold) {
        start = i;
        inRange = true;
      } else if (inRange && arr[i] <= threshold) {
        if (i - start > totalLen * 0.10) ranges.push({ start, end: i });
        inRange = false;
      }
    }

    if (inRange && arr.length - start > totalLen * 0.10) {
      ranges.push({ start, end: arr.length - 1 });
    }

    ranges.sort((a, b) => (b.end - b.start) - (a.end - a.start));
    return ranges.slice(0, 5);
  }

  function smoothArray(arr, radius) {
    const copy = arr.slice();

    for (let i = 0; i < arr.length; i++) {
      let sum = 0;
      let count = 0;

      for (let j = -radius; j <= radius; j++) {
        const idx = i + j;
        if (idx < 0 || idx >= arr.length) continue;
        sum += copy[idx];
        count++;
      }

      arr[i] = sum / Math.max(1, count);
    }
  }

  function dedupeCandidates(candidates) {
    const out = [];

    for (const cand of candidates) {
      const q = orderPoints(cand.points);
      const area = quadArea(q);
      if (area < imageW * imageH * 0.035) continue;

      let duplicate = false;

      for (const existing of out) {
        const e = orderPoints(existing.points);
        const d = averagePointDistance(q, e);

        if (d < Math.max(imageW, imageH) * 0.035) {
          duplicate = true;
          if (cand.score > existing.score) {
            existing.points = q;
            existing.score = cand.score;
            existing.label = cand.label;
          }
          break;
        }
      }

      if (!duplicate) out.push({ ...cand, points: q });
    }

    return out;
  }

  function averagePointDistance(a, b) {
    let total = 0;
    for (let i = 0; i < 4; i++) total += dist(a[i], b[i]);
    return total / 4;
  }

  function matToPoints(mat) {
    const pts = [];
    for (let i = 0; i < mat.rows; i++) {
      pts.push({ x: mat.data32S[i * 2], y: mat.data32S[i * 2 + 1] });
    }
    return pts;
  }

  function isValidQuad(pts) {
    const q = orderPoints(pts);
    const area = quadArea(q);
    if (area < imageW * imageH * 0.035) return false;
    if (area > imageW * imageH * 0.992) return false;

    const w1 = dist(q[0], q[1]);
    const w2 = dist(q[3], q[2]);
    const h1 = dist(q[0], q[3]);
    const h2 = dist(q[1], q[2]);

    if (Math.min(w1, w2, h1, h2) < Math.max(imageW, imageH) * 0.05) return false;
    return true;
  }

  function quadArea(q) {
    let area = 0;
    for (let i = 0; i < q.length; i++) {
      const p1 = q[i];
      const p2 = q[(i + 1) % q.length];
      area += p1.x * p2.y - p2.x * p1.y;
    }
    return Math.abs(area) / 2;
  }

  function rectangleScore(pts) {
    const q = orderPoints(pts);
    const top = dist(q[0], q[1]);
    const right = dist(q[1], q[2]);
    const bottom = dist(q[2], q[3]);
    const left = dist(q[3], q[0]);

    const widthConsistency = 1 - Math.min(1, Math.abs(top - bottom) / Math.max(top, bottom, 1));
    const heightConsistency = 1 - Math.min(1, Math.abs(left - right) / Math.max(left, right, 1));

    const angles = [];
    for (let i = 0; i < 4; i++) {
      const a = q[(i + 3) % 4];
      const b = q[i];
      const c = q[(i + 1) % 4];
      angles.push(rightAngleScore(a, b, c));
    }

    const angleScore = angles.reduce((s, v) => s + v, 0) / 4;
    return 0.35 * widthConsistency + 0.35 * heightConsistency + 0.30 * angleScore;
  }

  function rightAngleScore(a, b, c) {
    const v1x = a.x - b.x;
    const v1y = a.y - b.y;
    const v2x = c.x - b.x;
    const v2y = c.y - b.y;
    const dot = v1x * v2x + v1y * v2y;
    const l1 = Math.hypot(v1x, v1y);
    const l2 = Math.hypot(v2x, v2y);
    const cos = Math.abs(dot / Math.max(1, l1 * l2));
    return 1 - Math.min(1, cos);
  }

  function a4RatioScore(pts) {
    const q = orderPoints(pts);
    const w1 = dist(q[0], q[1]);
    const w2 = dist(q[3], q[2]);
    const h1 = dist(q[0], q[3]);
    const h2 = dist(q[1], q[2]);

    const ww = Math.max(1, (w1 + w2) / 2);
    const hh = Math.max(1, (h1 + h2) / 2);
    const ratio = Math.max(hh / ww, ww / hh);

    // A4뿐 아니라 엑셀/모니터 표처럼 넓은 사각형도 살림.
    const targets = [1.414, 1.6, 1.78, 2.0, 2.35];
    let best = 0.45;

    for (const target of targets) {
      const diff = Math.abs(ratio - target);
      let score;
      if (diff < 0.16) score = 1.45;
      else if (diff < 0.30) score = 1.22;
      else if (diff < 0.50) score = 1.0;
      else if (diff < 0.80) score = 0.72;
      else score = 0.45;
      best = Math.max(best, score);
    }

    return best;
  }

  function centerBiasScore(pts) {
    const q = orderPoints(pts);
    const cx = (q[0].x + q[1].x + q[2].x + q[3].x) / 4;
    const cy = (q[0].y + q[1].y + q[2].y + q[3].y) / 4;

    const dx = Math.abs(cx - imageW / 2) / imageW;
    const dy = Math.abs(cy - imageH / 2) / imageH;

    return Math.max(0.55, 1.18 - (dx + dy) * 1.15);
  }

  function expandPoints(pts, maxW, maxH, ratio) {
    const q = orderPoints(pts);
    const cx = (q[0].x + q[1].x + q[2].x + q[3].x) / 4;
    const cy = (q[0].y + q[1].y + q[2].y + q[3].y) / 4;

    return q.map(p => ({
      x: clamp(p.x + (p.x - cx) * ratio, 0, maxW),
      y: clamp(p.y + (p.y - cy) * ratio, 0, maxH)
    }));
  }

  function makeA4CenterPoints() {
    const imgRatio = imageH / imageW;
    const a4Ratio = 1.41421356;

    let boxW;
    let boxH;

    if (imgRatio >= 1) {
      boxH = imageH * 0.76;
      boxW = boxH / a4Ratio;
      if (boxW > imageW * 0.82) {
        boxW = imageW * 0.82;
        boxH = boxW * a4Ratio;
      }
    } else {
      boxW = imageW * 0.76;
      boxH = boxW / a4Ratio;
      if (boxH > imageH * 0.82) {
        boxH = imageH * 0.82;
        boxW = boxH * a4Ratio;
      }
    }

    const left = (imageW - boxW) / 2;
    const top = (imageH - boxH) / 2;
    const right = left + boxW;
    const bottom = top + boxH;

    return [
      { x: left, y: top },
      { x: right, y: top },
      { x: right, y: bottom },
      { x: left, y: bottom }
    ];
  }

  function makeDewarpDataUrl(inputPoints) {
    const q = orderPoints(inputPoints);

    let outW = Math.max(100, Math.round(Math.max(dist(q[0], q[1]), dist(q[3], q[2]))));
    let outH = Math.max(100, Math.round(Math.max(dist(q[0], q[3]), dist(q[1], q[2]))));

    const profile = sizeProfiles[sizeMode.value] || sizeProfiles.mid;
    const longSide = Math.max(outW, outH);

    if (longSide > profile.maxSide) {
      const ratio = profile.maxSide / longSide;
      outW = Math.round(outW * ratio);
      outH = Math.round(outH * ratio);
    }

    const out = document.createElement("canvas");
    out.width = outW;
    out.height = outH;

    const octx = out.getContext("2d", { willReadFrequently: true });
    octx.fillStyle = "white";
    octx.fillRect(0, 0, outW, outH);

    warpQuadToRect(octx, img, q, outW, outH, 48);
    applyFilterToCanvas(out, filterMode.value);

    const dataUrl = out.toDataURL("image/jpeg", profile.quality);
    const base64 = dataUrl.split(",")[1];
    const blob = base64ToBlob(base64, "image/jpeg");

    return { dataUrl, blob };
  }

  function applyFilterToCanvas(canvasEl, mode) {
    if (mode === "original") return;

    const c = canvasEl.getContext("2d", { willReadFrequently: true });
    const imgData = c.getImageData(0, 0, canvasEl.width, canvasEl.height);
    const data = imgData.data;

    if (mode === "vflat") {
      applyVFlatFilter(data, canvasEl.width, canvasEl.height);
    } else if (mode === "camscanner") {
      applyCamScannerFilter(data, canvasEl.width, canvasEl.height);
    } else if (mode === "bright") {
      adjustBrightnessContrast(data, 18, 1.12);
    } else if (mode === "gray") {
      grayscale(data, 1.22, 8);
    } else if (mode === "deepgray") {
      deepBlackWhite(data);
    } else if (mode === "sharp") {
      adjustBrightnessContrast(data, 8, 1.18);
      c.putImageData(imgData, 0, 0);
      sharpenCanvas(canvasEl);
      return;
    } else if (mode === "shadow") {
      normalizeShadow(data, canvasEl.width, canvasEl.height);
    } else {
      autoEnhance(data);
    }

    c.putImageData(imgData, 0, 0);
  }

  function applyVFlatFilter(data, w, h) {
    // 모니터/엑셀/정책표 박스용: 색은 많이 죽이지 않고 글자와 표선 대비를 올림.
    for (let i = 0; i < data.length; i += 4) {
      const r = data[i];
      const g = data[i + 1];
      const b = data[i + 2];

      let gray = 0.299 * r + 0.587 * g + 0.114 * b;

      // 모니터 촬영 특유의 회색 바탕을 밝히고 표선/글자를 살림
      let contrast = 1.24;
      let bright = 18;

      let nr = clamp((r - 128) * contrast + 128 + bright, 0, 255);
      let ng = clamp((g - 128) * contrast + 128 + bright, 0, 255);
      let nb = clamp((b - 128) * contrast + 128 + bright, 0, 255);

      // 과한 색 번짐 줄이기
      data[i] = clamp(nr * 0.72 + gray * 0.28, 0, 255);
      data[i + 1] = clamp(ng * 0.72 + gray * 0.28, 0, 255);
      data[i + 2] = clamp(nb * 0.72 + gray * 0.28, 0, 255);
    }
  }

  function applyCamScannerFilter(data, w, h) {
    // 종이 문서용: 배경은 더 하얗게, 글자는 더 진하게.
    normalizeShadow(data, w, h);

    for (let i = 0; i < data.length; i += 4) {
      let gray = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];

      gray = clamp((gray - 128) * 1.34 + 166, 0, 255);

      if (gray > 215) gray = 255;
      if (gray < 92) gray = Math.max(0, gray - 18);

      data[i] = data[i + 1] = data[i + 2] = gray;
    }
  }

  function adjustBrightnessContrast(data, brightness, contrast) {
    for (let i = 0; i < data.length; i += 4) {
      data[i] = clamp((data[i] - 128) * contrast + 128 + brightness, 0, 255);
      data[i + 1] = clamp((data[i + 1] - 128) * contrast + 128 + brightness, 0, 255);
      data[i + 2] = clamp((data[i + 2] - 128) * contrast + 128 + brightness, 0, 255);
    }
  }

  function grayscale(data, contrast = 1, brightness = 0) {
    for (let i = 0; i < data.length; i += 4) {
      let v = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
      v = clamp((v - 128) * contrast + 128 + brightness, 0, 255);
      data[i] = data[i + 1] = data[i + 2] = v;
    }
  }

  function deepBlackWhite(data) {
    for (let i = 0; i < data.length; i += 4) {
      const gray = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
      const v = gray > 162 ? 255 : 0;
      data[i] = data[i + 1] = data[i + 2] = v;
    }
  }

  function autoEnhance(data) {
    for (let i = 0; i < data.length; i += 4) {
      let r = data[i], g = data[i + 1], b = data[i + 2];
      r = clamp((r - 128) * 1.16 + 145, 0, 255);
      g = clamp((g - 128) * 1.16 + 145, 0, 255);
      b = clamp((b - 128) * 1.16 + 145, 0, 255);
      data[i] = r;
      data[i + 1] = g;
      data[i + 2] = b;
    }
  }

  function normalizeShadow(data, w, h) {
    const sampleStep = 12;
    let total = 0;
    let count = 0;

    for (let y = 0; y < h; y += sampleStep) {
      for (let x = 0; x < w; x += sampleStep) {
        const i = (y * w + x) * 4;
        total += (data[i] + data[i + 1] + data[i + 2]) / 3;
        count++;
      }
    }

    const avg = total / Math.max(1, count);

    for (let i = 0; i < data.length; i += 4) {
      const gray = (data[i] + data[i + 1] + data[i + 2]) / 3;
      const boost = avg - gray;
      let v = gray + boost * 0.35;
      v = clamp((v - 128) * 1.22 + 155, 0, 255);
      data[i] = data[i + 1] = data[i + 2] = v;
    }
  }

  function sharpenCanvas(canvasEl) {
    const c = canvasEl.getContext("2d", { willReadFrequently: true });
    const src = c.getImageData(0, 0, canvasEl.width, canvasEl.height);
    const dst = c.createImageData(src.width, src.height);
    const w = src.width;
    const h = src.height;
    const s = src.data;
    const d = dst.data;

    const kernel = [0, -1, 0, -1, 5, -1, 0, -1, 0];

    for (let y = 1; y < h - 1; y++) {
      for (let x = 1; x < w - 1; x++) {
        for (let cidx = 0; cidx < 3; cidx++) {
          let val = 0;
          let k = 0;

          for (let ky = -1; ky <= 1; ky++) {
            for (let kx = -1; kx <= 1; kx++) {
              const idx = ((y + ky) * w + (x + kx)) * 4 + cidx;
              val += s[idx] * kernel[k++];
            }
          }

          d[(y * w + x) * 4 + cidx] = clamp(val, 0, 255);
        }
        d[(y * w + x) * 4 + 3] = 255;
      }
    }

    c.putImageData(dst, 0, 0);
  }

  function base64ToBlob(base64, type) {
    const bin = atob(base64);
    const len = bin.length;
    const bytes = new Uint8Array(len);

    for (let i = 0; i < len; i++) bytes[i] = bin.charCodeAt(i);

    return new Blob([bytes], { type });
  }

  function orderPoints(pts) {
    const arr = pts.map(p => ({ x: p.x, y: p.y }));
    const sums = arr.map(p => p.x + p.y);
    const diffs = arr.map(p => p.y - p.x);

    return [
      arr[indexMin(sums)],
      arr[indexMin(diffs)],
      arr[indexMax(sums)],
      arr[indexMax(diffs)]
    ];
  }

  function indexMin(a) {
    let idx = 0;
    for (let i = 1; i < a.length; i++) if (a[i] < a[idx]) idx = i;
    return idx;
  }

  function indexMax(a) {
    let idx = 0;
    for (let i = 1; i < a.length; i++) if (a[i] > a[idx]) idx = i;
    return idx;
  }

  function dist(a, b) {
    return Math.hypot(a.x - b.x, a.y - b.y);
  }

  function bilinear(tl, tr, br, bl, u, v) {
    return {
      x:
        tl.x * (1 - u) * (1 - v) +
        tr.x * u * (1 - v) +
        br.x * u * v +
        bl.x * (1 - u) * v,
      y:
        tl.y * (1 - u) * (1 - v) +
        tr.y * u * (1 - v) +
        br.y * u * v +
        bl.y * (1 - u) * v
    };
  }

  function warpQuadToRect(octx, sourceImg, quad, outW, outH, grid) {
    const [tl, tr, br, bl] = quad;

    for (let gy = 0; gy < grid; gy++) {
      for (let gx = 0; gx < grid; gx++) {
        const u0 = gx / grid;
        const v0 = gy / grid;
        const u1 = (gx + 1) / grid;
        const v1 = (gy + 1) / grid;

        const s00 = bilinear(tl, tr, br, bl, u0, v0);
        const s10 = bilinear(tl, tr, br, bl, u1, v0);
        const s11 = bilinear(tl, tr, br, bl, u1, v1);
        const s01 = bilinear(tl, tr, br, bl, u0, v1);

        const d00 = { x: u0 * outW, y: v0 * outH };
        const d10 = { x: u1 * outW, y: v0 * outH };
        const d11 = { x: u1 * outW, y: v1 * outH };
        const d01 = { x: u0 * outW, y: v1 * outH };

        drawTriangle(octx, sourceImg, s00, s10, s11, d00, d10, d11);
        drawTriangle(octx, sourceImg, s00, s11, s01, d00, d11, d01);
      }
    }
  }

  function drawTriangle(ctx, image, s0, s1, s2, d0, d1, d2) {
    ctx.save();

    ctx.beginPath();
    ctx.moveTo(d0.x, d0.y);
    ctx.lineTo(d1.x, d1.y);
    ctx.lineTo(d2.x, d2.y);
    ctx.closePath();
    ctx.clip();

    const m = affineFromTriangles(s0, s1, s2, d0, d1, d2);
    ctx.setTransform(m.a, m.b, m.c, m.d, m.e, m.f);
    ctx.drawImage(image, 0, 0);

    ctx.restore();
  }

  function affineFromTriangles(s0, s1, s2, d0, d1, d2) {
    const sx0 = s0.x, sy0 = s0.y;
    const sx1 = s1.x, sy1 = s1.y;
    const sx2 = s2.x, sy2 = s2.y;

    const dx0 = d0.x, dy0 = d0.y;
    const dx1 = d1.x, dy1 = d1.y;
    const dx2 = d2.x, dy2 = d2.y;

    const denom =
      sx0 * (sy1 - sy2) +
      sx1 * (sy2 - sy0) +
      sx2 * (sy0 - sy1);

    if (Math.abs(denom) < 0.000001) {
      return { a: 1, b: 0, c: 0, d: 1, e: 0, f: 0 };
    }

    const a =
      (dx0 * (sy1 - sy2) +
       dx1 * (sy2 - sy0) +
       dx2 * (sy0 - sy1)) / denom;

    const c =
      (dx0 * (sx2 - sx1) +
       dx1 * (sx0 - sx2) +
       dx2 * (sx1 - sx0)) / denom;

    const e =
      (dx0 * (sx1 * sy2 - sx2 * sy1) +
       dx1 * (sx2 * sy0 - sx0 * sy2) +
       dx2 * (sx0 * sy1 - sx1 * sy0)) / denom;

    const b =
      (dy0 * (sy1 - sy2) +
       dy1 * (sy2 - sy0) +
       dy2 * (sy0 - sy1)) / denom;

    const d =
      (dy0 * (sx2 - sx1) +
       dy1 * (sx0 - sx2) +
       dy2 * (sx1 - sx0)) / denom;

    const f =
      (dy0 * (sx1 * sy2 - sx2 * sy1) +
       dy1 * (sx2 * sy0 - sx0 * sy2) +
       dy2 * (sx0 * sy1 - sx1 * sy0)) / denom;

    return { a, b, c, d, e, f };
  }

  window.addEventListener("resize", resizeCanvas);
  showReviewMode();
})();
